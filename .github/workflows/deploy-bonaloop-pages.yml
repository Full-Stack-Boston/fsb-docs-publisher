name: Deploy Bonaloop docs (Pages)
on:
  push:
    branches: [main]
    paths:
      - 'products/bonaloop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-bonaloop-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-bonaloop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:bonaloop:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bonaloop

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
